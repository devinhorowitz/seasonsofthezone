comments=Ties light, colour, foliage, fog and wind to the real-world date mapped onto the phenological seasons of Polesia. Self-contained: os.date() + one config file, no external tooling.
notes=Drives 20 Screen Space Shaders uniforms from the real-world date: colour grading, foliage, fog, wind and wetness, blended across a window centred on each season boundary. Five seasons, not four - winter is split because snow arrives in Polesia long before cover holds. TEXTURES ARE A SEPARATE LAYER: they bind from MO2's VFS at level load and are frozen for the session, so seasonal terrain is staged before launch by _tools/season.py (use play.bat). The in-engine layer needs none of that. CONFLICTS: never enable Season Flora alongside this - both drive the same flora uniforms and will fight. BUILT AROUND ONE FAILURE MODE: X-Ray rejects a WHOLE console command if ANY component is out of range - it does not clamp - leaving the old value and one "~ Invalid syntax in call to X" line in the log. So values are clamped on the way out, every set is read back, and a REFUSAL (value did not move) is told apart from DRIFT (something overwrote us); it gives up after 5 refusals and says so loudly instead of retrying forever. ssfx_floravariation is pinned at 0 on purpose: it is a hue rotation, not a tint, and driving it turned foliage red and blue. Config is gamedata/configs/seasons_of_the_zone.ltx, regenerate with _tools/build_seasons_ltx.py. VERIFY IN LOG: "[seasons] armed" then "[seasons] <season> applied" with every uniform reading OK.
