comments=Ties light, color, foliage, fog and wind to the real-world date mapped onto the phenological seasons of Polesia. Self-contained: os.date() + one config file, no external tooling.
notes=Sets twenty console values (color grade, tonemap, sun, foliage, fog, wind, wetness) from the real-world date, blended across each season boundary. Textures cannot follow at runtime; _tools/season.py stages them before launch (use play.bat). Never enable Season Flora alongside this. The season table is gamedata/configs/seasons_of_the_zone.ltx. A working session logs [seasons] armed, then [seasons] <season> applied.
